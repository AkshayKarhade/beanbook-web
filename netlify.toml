[build]
  command = "npm run build"
  publish = "dist"
  functions = "api"

[[redirects]]
  from = "/api/create-razorpay-order"
  to = "/.netlify/functions/create-razorpay-order"
  status = 200
  force = true

[[redirects]]
  from = "/api/verify-customer"
  to = "/.netlify/functions/verify-customer"
  status = 200
  force = true

[[redirects]]
  from = "/api/verify-razorpay-payment"
  to = "/.netlify/functions/verify-razorpay-payment"
  status = 200
  force = true

[[redirects]]
  from = "/api/razorpay-webhook"
  to = "/.netlify/functions/razorpay-webhook"
  status = 200
  force = true

[[redirects]]
  from = "/api/get-event-menu"
  to = "/.netlify/functions/get-event-menu"
  status = 200
  force = true

[[redirects]]
  from = "/api/ping"
  to = "/.netlify/functions/ping"
  status = 200
  force = true

[[redirects]]
  from = "/api/test-supabase"
  to = "/.netlify/functions/test-supabase"
  status = 200
  force = true

[[redirects]]
  from = "/beanbook/*"
  to = "/beanbook/index.html"
  status = 200

[[redirects]]
  from = "/api/business-onboarding"
  to = "/.netlify/functions/business-onboarding"
  status = 200
  force = true

[[redirects]]
  from = "/api/platform-admin"
  to = "/.netlify/functions/platform-admin"
  status = 200
  force = true

# The Supabase project URL is intended to be public, unlike SUPABASE_SECRET_KEY.
# Expose it to Vite only for Deploy Previews, without storing its value in git.
[context.deploy-preview]
  command = 'VITE_SUPABASE_URL="$SUPABASE_URL" npm run build'

# Netlify must still scan real secrets; exempt only this intentionally public URL.
[context.deploy-preview.environment]
  SECRETS_SCAN_OMIT_KEYS = "SUPABASE_URL"
