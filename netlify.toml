# The Supabase project URL is intended to be public, unlike SUPABASE_SECRET_KEY.
# Expose it to Vite only for Deploy Previews, without storing its value in git.

# Public Supabase project identifiers, used by browser code only.
# Context-scoped: do not populate Deploy Previews with production workspace config.
# Service-role/secret keys MUST remain Netlify runtime secrets, never VITE_* values.
[context.production.environment]
  VITE_SUPABASE_URL = "https://ensndmoitnkuuxlxmugn.supabase.co"
  VITE_SUPABASE_PUBLISHABLE_KEY = "sb_publishable_bolGKll4fwWig8JW-kMrtg_e3f-aNDP"
  VITE_BEANBOOK_ADMIN_SUPABASE_URL = "https://ensndmoitnkuuxlxmugn.supabase.co"
  VITE_BEANBOOK_ADMIN_SUPABASE_PUBLISHABLE_KEY = "sb_publishable_bolGKll4fwWig8JW-kMrtg_e3f-aNDP"

[context.deploy-preview]
  command = "npm run build"

# Netlify must still scan real secrets; exempt only this intentionally public URL.
[context.deploy-preview.environment]
  SECRETS_SCAN_OMIT_KEYS = "SUPABASE_URL"
